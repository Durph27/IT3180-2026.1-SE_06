spring.application.name=bluemoon
# Supports launching from either repository root or backend/.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bluemoon_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.pdf.font=${PDF_FONT_PATH:}
